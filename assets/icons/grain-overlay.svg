<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <filter id="studio-grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncA type="table" tableValues="0 0.35"/>
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#studio-grain)" opacity="0.5"/>
</svg>
